default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        files: ^skills/.*\.py$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args:
          - --select=F401,F821
          - --fix
        files: ^skills/.*\.py$
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black-jupyter
        files: ^skills/.*\.py$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--config", ".codespellrc"]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.7
    hooks:
      - id: clang-format
        types_or: [c++, cuda]
        args: [--style=file, --verbose]
  - repo: local
    hooks:
      - id: skill-docs
        name: validate skill frontmatter and local references
        entry: python -m unittest discover -s tests -p test_skill_docs.py
        language: python
        additional_dependencies: ["PyYAML>=6,<7"]
        pass_filenames: false
        files: ^(README\.md|docs/.*\.md|skills/.*\.md|tests/test_skill_docs\.py|\.pre-commit-config\.yaml)$
